<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Footer Recreation</title>

    <style>
      body {
        margin: 0;
        background: #111;
        font-family: Arial, sans-serif;
      }

      .footer {
        background: #000;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        letter-spacing: 0.5px;
      }

      .left-section {
        display: flex;
        gap: 70px;
        align-items: center;
      }

      .footer-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .footer-item img {
        width: 35px;
        height: 35px;
        object-fit: contain;
      }

      .footer-labels {
        display: flex;
        flex-direction: column;
        font-size: 15px;
      }

      .footer-labels .title {
        font-weight: bold;
        font-size: 15px;
      }

      .right-section {
        text-align: center;
        color: white;
      }

      .payment-logos {
        display: flex;
        gap: 25px;
        justify-content: center;
        margin-bottom: 5px;
      }

      .payment-logos img {
        height: 35px;
        object-fit: contain;
      }

      .payment-text {
        font-size: 14px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="footer">
      <!-- LEFT SIDE -->
      <div class="left-section">
        <div class="footer-item">
          <img src="images/icons/facebook-icon.png" alt="Facebook Icon" />
          <div class="footer-labels">
            <span class="title">Facebook</span>
            <span>Noir's Discount Store</span>
          </div>
        </div>

        <div class="footer-item">
          <img src="images/icons/messenger-icon.png" alt="Messenger Icon" />
          <div class="footer-labels">
            <span class="title">Messenger</span>
            <span>noir.discount.store</span>
          </div>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="right-section">
        <div class="payment-logos">
          <img src="images/icons/gcash.png" alt="GCash" />
          <img src="images/icons/ub.png" alt="UnionBank" />
          <img src="images/icons/bdo.png" alt="BDO" />
          <img src="images/icons/maribank.png" alt="MariBank" />
        </div>
        <div class="payment-text">Modes of Payment</div>
      </div>
    </div>
  </body>
</html>
